name: Management MATLAB CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main ]

jobs:
  gres_tests:
    name: ${{ matrix.display_name }}
    if: github.event.pull_request == null || github.event.pull_request.draft == false

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            display_name: Linux (Ubuntu Latest, GCC 11)
          - os: windows-latest
            display_name: Windows (Windows 2022, MSVC 2022)
          - os: macos-latest
            display_name: macOS (macOS Latest, Apple Clang)

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Detect changes in linear solver
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            linsolver:
              - 'Code/linsolver/**'
              - 'ThirdPartyLibs/ChronosLab/**'
              - '.github/workflows/main.yml'

      - name: Checkout external git submodules (MRST)
        run: |
          git submodule sync -- ThirdPartyLibs/MRST
          git submodule update --init ThirdPartyLibs/MRST

      - name: Checkout ChronosLab git submodule (conditional)
        if: steps.filter.outputs.linsolver == 'true'
        run: |
          git submodule sync -- ThirdPartyLibs/ChronosLab
          git submodule update --init --recursive ThirdPartyLibs/ChronosLab

      - name: Ensure GCC 11 is active on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y gcc-11 g++-11
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100
          gcc --version
          g++ --version

      - name: Install OpenMP on macOS
        if: matrix.os == 'macos-latest'
        run: |
          brew install libomp

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          products: >
            Parallel_Computing_Toolbox

      - name: Initialize GReS, compile MEX, and run tests
        uses: matlab-actions/run-command@v3
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
          LINSOLVER_CHANGED: ${{ steps.filter.outputs.linsolver }}
        with:
          generate-summary: false
          command: |
            try
                initGReS;
                compileAll;
                run("Code/unittest/runUnitTests.m");
                run("Code/integratedTest/runIntegratedTests.m");

                if strcmp(getenv('LINSOLVER_CHANGED'), 'true')
                    fprintf('\n========================================\n');
                    fprintf('Running Linear Solver & Chronos Tests...\n');
                    fprintf('========================================\n\n');
                    run("Code/linsolver/test/runLinSolverTests.m");
                end
            catch ME
                disp(getReport(ME));
                exit(1); % Mark job as failed
            end

  aggregate:
    name: check_all_tests_passed
    runs-on: ubuntu-latest
    needs: [gres_tests]
    if: github.event.pull_request == null || github.event.pull_request.draft == false

    steps:
      - name: All platform tests passed
        run: echo "All tests succeeded on all platforms"
